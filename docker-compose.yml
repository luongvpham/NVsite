# Hạ tầng dev/test LOCAL — không phải production (Caddy/production compose là việc khác, xem
# Quyết định #9 khi tới lúc). Kết nối qua connection string trong
# backend/src/Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsite
      POSTGRES_PASSWORD: vsite_dev_only
      POSTGRES_DB: vsite_dev
    ports:
      - '5432:5432'
    volumes:
      - vsite_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  vsite_postgres_data:
