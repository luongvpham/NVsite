name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  docs-check:
    name: Docs check
    # ubuntu cố ý — filesystem phân biệt hoa thường. Máy dev Windows/NTFS không phân biệt,
    # nên `docs/tasks/...` viết sai hoa vẫn resolve được ở local và chỉ vỡ ở đây.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Banner STATUS, tham chiếu quyết định, changelog theo task, đường dẫn
        run: node tools/docs/check-docs.mjs
      - name: 00-INDEX §2 khớp banner (sinh lại rồi so)
        run: node tools/docs/gen-doc-index.mjs --check

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: gen:registry (Vsite.Api link file derivative-presets.json do codegen sinh)
        run: pnpm --filter @vsite/builder-components run gen:registry
      - name: dotnet test ArchitectureTests
        working-directory: backend
        run: dotnet test tests/ArchitectureTests --logger "console;verbosity=normal"

  contract-check:
    name: Contract drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: gen:registry (Program.cs fail-fast nếu thiếu derivative-presets.json)
        run: pnpm --filter @vsite/builder-components run gen:registry
      - name: Test classifier của contract-sync (mảng, schema lồng, parameters, operationId)
        run: node --test tools/contract-sync/lib/diff.test.mjs
      - name: Export runtime OpenAPI + check no drift vs approved contract
        run: |
          node tools/contract-sync/export.mjs
          node tools/contract-sync/check-no-drift.mjs

  be-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: gen:registry (ComponentSchemaTests đọc packages/builder-components/generated/props-schemas.json)
        run: pnpm --filter @vsite/builder-components run gen:registry
      - name: dotnet test
        working-directory: backend
        run: dotnet test --logger "console;verbosity=normal"

  fe-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm build (gen:api + gen:registry + apps)
        run: pnpm build
      # TOOLING-001 — vite build và vitest bỏ qua kiểu: trước bước này, sửa manifest làm hỏng kiểu
      # của component vẫn ra xanh. Lint chưa từng chạy trong CI nên lỗi tồn lâu không ai thấy.
      - name: pnpm typecheck (tsc --noEmit mọi package)
        run: pnpm typecheck
      - name: pnpm lint
        run: pnpm lint
      - name: check-additive (registry.lock.json tồn tại, phủ đủ registry, không vi phạm additive-only)
        run: pnpm check:registry-additive
      - name: pnpm test
        run: pnpm test
      - name: generated đã commit khớp với contract/manifest (không quên gen:api, kể cả file MỚI chưa track)
        run: |
          out="$(git status --porcelain -- packages/api-sdk/src/generated)"
          if [ -n "$out" ]; then echo "$out"; echo "Chạy pnpm gen:api rồi commit packages/api-sdk/src/generated"; exit 1; fi
